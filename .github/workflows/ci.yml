name: CI

# The deploy workflow only runs on pushes to main, so until now nothing ran
# against a pull request: a failing test or a broken build was first noticed
# during the deploy, after it had already merged.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # `npm ci` needs a lockfile, and this repo gitignores package-lock.json —
      # same reason the deploy workflow installs this way.
      - run: npm install
      - run: npm test
      - run: npm run build
